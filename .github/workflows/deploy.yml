name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the copy parity check needs history to diff against
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Structural parity: a key missing from en.ts is a type error.
      - run: npm run check
      # Semantic parity: a string reworded in one language but not the other.
      - name: German/English copy parity
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/check-i18n-parity.mjs --base "$BASE" --head HEAD
          else
            echo "No base commit to compare against — skipping."
          fi

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # ---------------------------------------------------------------
          # WHERE THE SITE LIVES. To move to the real domain, do all three:
          #   1. SITE:      https://whatmakesyoumove.org
          #   2. BASE_PATH: delete the line entirely
          #   3. add public/CNAME containing: whatmakesyoumove.org
          #      (this is what flips GitHub to the custom domain, so add it
          #       only once DNS resolves - until then it kills the preview URL)
          # Dropping BASE_PATH also re-enables indexing: robots.txt and the
          # noindex meta tag both key off it.
          # ---------------------------------------------------------------
          SITE: https://schneider3000-collab.github.io
          BASE_PATH: /wmym-homepage
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
