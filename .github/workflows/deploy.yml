name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Structural parity: a key missing from en.ts is a type error.
      # Semantic parity (a string reworded in one language but not the other) is
      # a local-only pre-commit hook (.githooks/pre-commit), not enforced here:
      # it has no way to honor a deliberate SKIP_I18N_CHECK=1, which would
      # otherwise block deploys for legitimate one-sided fixes (typos, etc.).
      - run: npm run check

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # ---------------------------------------------------------------
          # WHERE THE SITE LIVES. Served from its own domain, so no BASE_PATH.
          # The custom domain is set by public/CNAME, which must stay in the
          # build artifact: with an Actions deploy, setting the domain only in
          # Settings > Pages gets wiped by the next deploy.
          # No BASE_PATH also means this is not a preview, so robots.txt and
          # the noindex meta tag allow indexing again.
          # ---------------------------------------------------------------
          SITE: https://whatmakesyoumove.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
